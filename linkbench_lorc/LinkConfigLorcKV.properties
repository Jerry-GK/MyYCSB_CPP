# Official LinkBench configuration using the LorcKV LinkStore adapter.
#
# The workload itself is upstream LinkBench's FBWorkload.properties and
# Distribution.dat. This file only replaces the database backend through the
# standard LinkStore/NodeStore extension point.

workload_file = config/FBWorkload.properties

linkstore = com.facebook.LinkBench.LinkStoreLorcKV
nodestore = com.facebook.LinkBench.LinkStoreLorcKV

dbid = linkdb
debuglevel = INFO
progressfreq = 300
displayfreq = 1800
load_progress_interval = 50000
req_progress_interval = 10000
maxsamples = 10000

loaders = 10
generate_nodes = true
loader_chunk_size = 2048

requesters = 16
requests = 200000
requestrate = 0
maxtime = 100000
warmup_time = 0
max_failed_requests = 100

write_options_sync = false
write_options_disableWAL = false

lorckv.db_path = /tmp/linkbench_lorckv
lorckv.engine = rocksdb
lorckv.native_library = /home/gjr/projects/MyYCSB_CPP/linkbench_lorc/build/liblorc_linkbench_jni.so
lorckv.destroy = false
lorckv.create_if_missing = true
lorckv.disable_wal = false
lorckv.disable_auto_compactions = false

lorckv.enable_blob_files = false
lorckv.min_blob_size = 512
lorckv.blob_file_size = 67108864

lorckv.block_cache_size = 1073741824
lorckv.blob_cache_size = 0
lorckv.range_cache_size = 0
lorckv.value_separation_aware = false
lorckv.bypass_lower_cache_on_refill = false
lorckv.index_only_on_refill = false
lorckv.min_materialized_value_bytes = 0
lorckv.min_materialized_range_entries = 4
lorckv.min_materialized_range_bytes = 0
lorckv.max_materialized_range_entries = 0
lorckv.max_materialized_range_bytes = 0
lorckv.short_range_expansion_entries = 32
lorckv.short_range_probe_admission = true
lorckv.short_range_probe_capacity = 4096
lorckv.enable_statistics = true
